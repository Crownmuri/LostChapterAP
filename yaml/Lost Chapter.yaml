# Test player file for Lost Chapter. Copy it into the Players folder of your Archipelago install.
name: LostChapter
description: Lost Chapter test seed
game: Lost Chapter
requires:
  version: 0.6.7

Lost Chapter:
  # normal_end: defeat the last boss
  # true_end: defeat the last boss with a climax count of 20 or less
  # true_virgin: the true end with the Virginity status intact, losing it ends the run.
  #             No story difference, only for those who want the challenge
  # dlc_end: defeat Magislilia behind the last door of the DLC. Needs include_dlc
  # dlc_virgin: the DLC end with the Virginity status intact, losing it ends the run. Needs include_dlc
  goal: normal_end

  # Adds the DLC to the multiworld: checks for its monsters, events, titles and relics where applicable.
  # Only turn this on when you own the DLC
  include_dlc: false

  # The White Key and Black Key are shuffled as relics (needs relicsanity). false: made at the Locksmith as usual
  shuffle_keys: false

  # Relics found in events become checks and are shuffled into the pool
  relicsanity: true

  # The first win against each regular enemy is a check
  first_victories: true

  # Releasing a title also needs its Unlock Title Effect item. false: titles release as in the normal game
  shuffle_title_effects: true

  # Kick Balls, the card that turns up after the enemy climaxes and defeats it outright
  # vanilla: as in the normal game
  # shuffle: only once the Kick Balls item is found
  # remove: never
  finisher_move: vanilla

  # 0-4. Progressive Field Exploration items in the pool, each adds a floor event to the two you choose from.
  # Expected by floor 41, 61, 81 and 101
  field_exploration: 0

  # 100-200. The floor to reach before the final boss can be challenged at the doors of a boss floor
  final_boss_floor: 100

  # 0-100. How much of the filler is traps. The rest is gold and one-time stat boosts for the current run
  trap_percentage: 20

  # 0-100 each. How the traps are split between the five kinds, compared with each other. 0 leaves a kind out
  climax_trap_weight: 20      # forces a climax on your next turn
  confusion_trap_weight: 20
  sticky_trap_weight: 20
  paralysis_trap_weight: 20
  acid_trap_weight: 20        # dissolves your clothes

  # 0-36. Floor event unlocks you start with, picked at random from the events of the first 40 floors.
  # Desert, Temple, Hot Spring, Market and Small Room are one unlock for two events each
  starting_event_count: 2

  # Floor events unlocked from the start by name, e.g. ["Market", "Inn"]. They count towards the number above.
  #   Marsh, Hot Spring, Forest, Inn, Desert, Temple, Collapse, Beggar, Quarrel, Market, Small Room,
  #   Amusement Center, Flower, Cherry Blossoms, Storage Room, Library, Girl, Battlefield, Dog, Cat, Camp,
  #   Seamstress, River, Gold and Silver Treasures, Debauch, Sea, Snowy Mountain, Suspension Bridge, Pond, Highway,
  #   Lake Shore, Locksmith, Corridor, Throne, Hill, Prison
  # With include_dlc also:
  #   Change to Swimsuit, Barracks, Farm Village, Old Woman, Checkpoint, Clinic, Slave Market, Graveyard,
  #   Girl with Flower Crown, Sculptor, Treasury
  starting_events: []

  # 1-10. Souls start at 0 with every run and send checks at milestones from 50 to 2000
  soul_multiplier: 2

  progression_balancing: 50
  accessibility: full
